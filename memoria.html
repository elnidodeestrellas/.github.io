<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memoria Mágica | El Nido de Estrellas</title>
    <meta name="description" content="Encuentra las parejas de ilustraciones en este divertido juego de memoria para niños.">
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    
    <script data-goatcounter="https://elnidodeestrellas.goatcounter.com/count"
        async src="https://gc.zgo.at/count.js"></script>
        
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="estilos.css">
    
    <style>
        .memoria-main-container {
            max-width: 700px;
            margin: 40px auto;
            text-align: center;
            padding: 20px;
        }
        #tablero-memoria {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            width: 450px;
            margin: 20px auto;
            border: 4px solid #f1c442;
            background: #222;
            padding: 12px;
            border-radius: 12px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.2);
        }
        .carta-memoria {
            width: 95px;
            height: 95px;
            background-color: #131c31;
            border: 2px dashed rgba(241, 196, 66, 0.4);
            border-radius: 8px;
            cursor: pointer;
            background-size: cover;
            background-position: center;
            transition: transform 0.2s, border-color 0.2s;
        }
        .carta-memoria:hover {
            transform: scale(1.03);
            border-color: #f1c442;
        }
        .carta-oculta {
            background-image: none !important;
            background-color: #1a253a;
        }
        .carta-oculta::after {
            content: "⭐";
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            font-size: 24px;
        }
        .carta-encontrada {
            border: 2px solid #27ae60;
            cursor: default;
            transform: scale(1);
        }
        #mensaje-victoria-memoria {
            font-size: 20px;
            color: #27ae60;
            font-weight: bold;
            margin-top: 15px;
            min-height: 30px;
        }
        .acciones-memoria {
            margin-top: 20px;
        }
        .btn-memoria {
            background: #f1c442;
            color: #1a1a2e;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            margin: 5px;
            font-size: 14px;
            transition: background 0.2s;
        }
        .btn-memoria:hover {
            background: #d4ac37;
        }
    </style>
</head>
<body>

   <div id="menu-container"></div>

    <main class="main-content memoria-main-container">
        <h2>✨ Memoria Mágica</h2>
        <div class="edad-badge">🧠 Recomendado a partir de 4 años</div>
        <p>Levanta las cartas de dos en dos y encuentra todas las parejas de ilustraciones.</p>
        
        <div id="tablero-memoria"></div>
        <div id="mensaje-victoria-memoria"></div>
        
        <div class="acciones-memoria">
            <button class="btn-memoria" onclick="iniciarMemoria()">Reiniciar juego</button>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 El Nido de Estrellas. | Visita nuestro <a href="https://www.youtube.com/@elnidodeestrellas" target="_blank">Canal de YouTube</a></p>
    </footer>

    <script src="global.js"></script>
    <script src="nav.js"></script>
    <script>
        // Lista amplia con todas las imágenes disponibles de tus cuentos[cite: 3]
        const bancoImagenes = [
            'img/cuentos/c1-img1.webp',
            'img/cuentos/c3-img1.webp',
            'img/cuentos/c3-img4.webp',
            'img/cuentos/c4-img4.webp',
            'img/cuentos/c6-img1.webp',
            'img/cuentos/c6-img5.webp',
            'img/cuentos/c7-img6.webp',
            'img/cuentos/c7-img9.webp',
            'img/cuentos/c9-img1.webp'
        ];

        let cartasJuego = [];
        let primeraCarta = null;
        let segundaCarta = null;
        let bloqueoTablero = false;
        let parejasEncontradas = 0;

        function iniciarMemoria() {
            const tablero = document.getElementById('tablero-memoria');
            document.getElementById('mensaje-victoria-memoria').innerText = '';
            tablero.innerHTML = '';
            
            primeraCarta = null;
            segundaCarta = null;
            bloqueoTablero = false;
            parejasEncontradas = 0;

            // 1. Mezclar el banco general y seleccionar aleatoriamente solo 6 imágenes para esta partida[cite: 3]
            const bancoMeclado = [...bancoImagenes].sort(() => Math.random() - 0.5);
            const imagenesSeleccionadas = bancoMeclado.slice(0, 6);

            // 2. Duplicar esas 6 imágenes para formar las parejas (6 x 2 = 12 cartas)[cite: 3]
            cartasJuego = [...imagenesSeleccionadas, ...imagenesSeleccionadas];
            
            // 3. Mezclar las cartas en el tablero[cite: 3]
            mezclarArray(cartasJuego);

            cartasJuego.forEach((imagen) => {
                const carta = document.createElement('div');
                carta.className = 'carta-memoria carta-oculta';
                carta.dataset.imagen = imagen;
                carta.onclick = () => voltearCarta(carta);
                tablero.appendChild(carta);
            });
        }

        function mezclarArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        function voltearCarta(carta) {
            if (bloqueoTablero) return;
            if (carta === primeraCarta) return;
            if (carta.classList.contains('carta-encontrada')) return;

            carta.classList.remove('carta-oculta');
            carta.style.backgroundImage = `url('${carta.dataset.imagen}')`;

            if (!primeraCarta) {
                primeraCarta = carta;
                return;
            }

            segundaCarta = carta;
            comprobarPareja();
        }

        function comprobarPareja() {
            const esCoincidencia = primeraCarta.dataset.imagen === segundaCarta.dataset.imagen;

            if (esCoincidencia) {
                primeraCarta.classList.add('carta-encontrada');
                segundaCarta.classList.add('carta-encontrada');
                parejasEncontradas++;

                resetearTurno();

                if (parejasEncontradas === 6) {
                    document.getElementById('mensaje-victoria-memoria').innerText = '🎉 ¡Increíble, has encontrado todas las parejas! 🎉';
                }
            } else {
                bloqueoTablero = true;
                setTimeout(() => {
                    primeraCarta.classList.add('carta-oculta');
                    primeraCarta.style.backgroundImage = '';
                    segundaCarta.classList.add('carta-oculta');
                    segundaCarta.style.backgroundImage = '';
                    resetearTurno();
                }, 1000);
            }
        }

        function resetearTurno() {
            primeraCarta = null;
            segundaCarta = null;
            bloqueoTablero = false;
        }

        window.onload = iniciarMemoria;
    </script>
</body>
</html>
