<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Panel de Estadísticas - El Nido de Estrellas</title>
    <style>
        body { background-color: #1a1a2e; color: #fff; font-family: sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .card { background: #16213e; padding: 25px; border-radius: 12px; border: 1px solid #f1c442; width: 520px; box-shadow: 0 4px 25px rgba(0,0,0,0.7); }
        h2 { color: #f1c442; margin-top: 0; font-size: 20px; text-align: center; }
        input { padding: 10px; border-radius: 6px; border: 1px solid #444; background: #0f172a; color: #fff; width: 85%; margin-bottom: 15px; font-size: 14px; }
        button { background: #f1c442; color: #1a1a2e; border: none; padding: 9px 15px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 13px; }
        button:hover { background: #e0b330; }
        
        /* Sistema de pestañas superiores mejorado */
        .pestanas-container { display: flex; gap: 4px; margin-bottom: 15px; background: #0f172a; padding: 4px; border-radius: 8px; flex-wrap: wrap; justify-content: center; }
        .btn-pestana { background: transparent; color: #a0aec0; border: none; padding: 7px 8px; font-size: 11px; border-radius: 6px; cursor: pointer; font-weight: bold; transition: all 0.2s; }
        .btn-pestana.activo { background: #f1c442; color: #1a1a2e; }

        /* Tarjeta de sección estrella */
        .card-estrella {
            background: linear-gradient(135deg, #2a2356, #1f2947);
            border: 1px solid #f1c442;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 15px;
        }
        .card-estrella h3 { margin: 0 0 3px 0; color: #f1c442; font-size: 12px; text-transform: uppercase; letter-spacing: 1px; }
        .card-estrella p { margin: 0; font-size: 14px; font-weight: bold; color: #fff; }

        /* Contenedor de lista con scroll si hay muchos elementos */
        .scroll-lista { max-height: 250px; overflow-y: auto; padding-right: 5px; margin-bottom: 15px; }
        .scroll-lista::-webkit-scrollbar { width: 6px; }
        .scroll-lista::-webkit-scrollbar-thumb { background: #2a3b6c; border-radius: 3px; }

        /* Botones de acción inferior */
        .botones-container { display: flex; gap: 8px; margin-top: 10px; }
        .btn-accion { flex: 1; font-size: 12px; padding: 8px; }
        .btn-actualizar { background: #3182ce; color: white; }
        .btn-actualizar:hover { background: #2b6cb0; }
        .btn-exportar { background: #2b6cb0; color: white; }
        .btn-exportar:hover { background: #2c5282; }
        .btn-reset { background: #9b2c2c; color: white; }
        .btn-reset:hover { background: #822727; }

        .oculto { display: none; }
        .enlace-web { margin-top: 15px; font-size: 12px; text-align: center; }
        .enlace-web a { color: #90cdf4; text-decoration: none; }
        .enlace-web a:hover { text-decoration: underline; }
        .info-tiempo { text-align: center; font-size: 11px; color: #a0aec0; margin-top: 8px; }

        /* Lista y barras visuales */
        .lista-stats { list-style: none; padding: 0; margin: 0; }
        .item-stat {
            background: #0f172a;
            margin-bottom: 8px;
            padding: 8px 10px;
            border-radius: 6px;
            font-size: 12px;
        }
        .item-info { display: flex; justify-content: space-between; margin-bottom: 4px; font-weight: bold; }
        .item-info span:last-child { color: #48bb78; }
        
        .barra-fondo { background: #1a202c; height: 6px; border-radius: 3px; overflow: hidden; width: 100%; }
        .barra-progreso { background: linear-gradient(90deg, #48bb78, #f1c442); height: 100%; width: 0%; border-radius: 3px; transition: width 0.5s ease-in-out; }
    </style>
</head>
<body>

    <!-- Pantalla de Login -->
    <div class="card" id="pantalla-login" style="text-align: center;">
        <h2>Panel Privado</h2>
        <p style="font-size: 13px; color: #cbd5e0; margin-bottom: 20px;">Introduce tu contraseña:</p>
        <input type="password" id="input-pass" placeholder="Contraseña...">
        <br>
        <button onclick="verificarPassword()">Entrar</button>
        <p id="error-pass" style="color: #fc8181; font-size: 12px; margin-top: 12px;"></p>
    </div>

    <!-- Panel de Estadísticas con Pestañas -->

        <h2>📊 Panel de Rendimiento</h2>

        <!-- Pestañas de Navegación del Panel -->
        <div class="pestanas-container">
            <button class="btn-pestana activo" id="tab-menu" onclick="cambiarVista('menu')">🏠 Menú</button>
            <button class="btn-pestana" id="tab-index" onclick="cambiarVista('index')">📄 Inicio</button>
            <button class="btn-pestana" id="tab-cuentos" onclick="cambiarVista('cuentos')">📁 Cuentos</button>
            <button class="btn-pestana" id="tab-audios" onclick="cambiarVista('audios')">🎧 Audios</button>
            <button class="btn-pestana" id="tab-recursos" onclick="cambiarVista('recursos')">📚 Recursos</button>
            <button class="btn-pestana" id="tab-podcast" onclick="cambiarVista('podcast')">🎙️ Podcast</button>
            <button class="btn-pestana" id="tab-puzzles" onclick="cambiarVista('puzzles')">🧩 Puzles</button>
            <button class="btn-pestana" id="tab-lectura" onclick="cambiarVista('lectura')">📖 Lectura</button>
            <button class="btn-pestana" id="tab-contacto" onclick="cambiarVista('contacto')">✉️ Contacto</button>
            <button class="btn-pestana" id="tab-tuvoz" onclick="cambiarVista('tuvoz')">⭐ Tu voz</button>
        </div>
        
        <!-- Tarjeta Destacada -->
        <div class="card-estrella">
            <h3 id="titulo-estrella">🏆 Más Popular</h3>
            <p id="elemento-estrella">Calculando...</p>
        </div>
        
        <!-- Contenedor con scroll para las listas -->
        <div class="scroll-lista">
            <ul class="lista-stats" id="contenedor-lista"></ul>
        </div>
        
        <div class="botones-container">
            <button class="btn-accion btn-actualizar" onclick="cargarEstadisticas()">Actualizar</button>
            <button class="btn-accion btn-exportar" onclick="exportarDatos()" title="Guardar copia de seguridad en archivo">Exportar</button>
            <button class="btn-accion btn-reset" onclick="reiniciarStats()" title="Poner contadores a cero">Reiniciar</button>
        </div>

        <div class="info-tiempo" id="info-tiempo">Última actualización: --:--:--</div>
        <div class="info-tiempo" id="info-reinicio" style="color: #f6ad55;">Fecha de inicio de conteo: --/--/----</div>
        
        <div class="enlace-web">
            <a href="https://elnidodeestrellas.com" target="_blank">🌐 Ir a la página web</a>
        </div>
    </div>

        function verificarPassword() {
            if (document.getElementById('input-pass').value === PASSWORD_CORRECTA) {

            } else {

            }
        }

        document.getElementById('input-pass').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') verificarPassword();
        });

        function cambiarVista(vista) {
            vistaActual = vista;
            document.getElementById('tab-menu').classList.toggle('activo', vista === 'menu');

        function obtenerListaActual() {
            if (vistaActual === 'menu') return datosMenu;
            if (vistaActual === 'index') return datosIndex;
            if (vistaActual === 'cuentos') return datosCuentos;
            if (vistaActual === 'audios') return datosAudios;
            if (vistaActual === 'recursos') return datosRecursos;
            if (vistaActual === 'podcast') return datosPodcast;
            if (vistaActual === 'puzzles') return datosPuzzles;
            if (vistaActual === 'lectura') return datosLectura;
            if (vistaActual === 'contacto') return datosContacto;
            return datosTuVoz;
        }

        function cargarEstadisticas() {
            let listaElementos = obtenerListaActual();
            let datosProcesados = [];
            let maxClics = 1;

            listaElementos.forEach(item => {
                let valorAlmacenado = localStorage.getItem(item.clave);
                let total = valorAlmacenado ? parseInt(valorAlmacenado, 10) : 0;
                datosProcesados.push({ nombre: item.nombre, total: total, clave: item.clave });
                if (total > maxClics) maxClics = total;
            });

            datosProcesados.sort((a, b) => b.total - a.total);

            let estrella = datosProcesados[0];
            let textoEstrella = estrella.total > 0 ? `${estrella.nombre} (${estrella.total} clics)` : "Todavía sin registros";
            document.getElementById('elemento-estrella').textContent = textoEstrella;

            let htmlFinal = '';
            datosProcesados.forEach(item => {
                let porcentaje = Math.round((item.total / maxClics) * 100);
                let anchoBarra = item.total > 0 ? Math.max(porcentaje, 6) : 0;

                htmlFinal += `
                    <li class="item-stat">
                        <div class="item-info">
                            <span>${item.nombre}</span>
                            <span>${item.total} clics</span>
                        </div>
                        <div class="barra-fondo">
                            <div class="barra-progreso" style="width: ${anchoBarra}%;"></div>
                        </div>
                    </li>
                `;
            });

            document.getElementById('contenedor-lista').innerHTML = htmlFinal;
            document.getElementById('info-tiempo').textContent = `Última actualización: ${new Date().toLocaleTimeString()}`;

            let fechaInicio = localStorage.getItem('nido_fecha_inicio');
            if (!fechaInicio) {
                fechaInicio = new Date().toLocaleDateString();
                localStorage.setItem('nido_fecha_inicio', fechaInicio);
            }
            document.getElementById('info-reinicio').textContent = `Fecha de inicio de conteo: ${fechaInicio}`;
        }

        function reiniciarStats() {
            let listaElementos = obtenerListaActual();
            let nombresVistas = {
                'menu': "del Menú Principal",
                'index': "de los Botones de Inicio",
                'cuentos': "de la Sección de Cuentos General",
                'audios': "de los Audios de Cuentos",
                'recursos': "de los Recursos para Padres",
                'podcast': "de los Episodios del Podcast",
                'puzzles': "de los Puzles Mágicos",
                'lectura': "del Rincón de Lectura",
                'contacto': "de la Sección de Contacto",
                'tuvoz': "de la Sección Tu Voz"
            };
            
            if (confirm(`¿Quieres poner a cero los contadores ${nombresVistas[vistaActual]}?`)) {
                listaElementos.forEach(item => {
                    localStorage.removeItem(item.clave);
                });
                localStorage.setItem('nido_fecha_inicio', new Date().toLocaleDateString());
                cargarEstadisticas();
            }
        }

        function exportarDatos() {
            let reporte = "=== COPIA DE SEGURIDAD ESTADÍSTICAS EL NIDO DE ESTRELLAS ===\n\n";

            reporte += `Fecha de inicio de conteo: ${localStorage.getItem('nido_fecha_inicio') || 'N/A'}\n\n`;

            const todasLasSecciones = [...datosMenu, ...datosIndex, ...datosCuentos, ...datosAudios, ...datosRecursos, ...datosPodcast, ...datosPuzzles, ...datosLectura, ...datosContacto, ...datosTuVoz];
            todasLasSecciones.forEach(item => {
                let valor = localStorage.getItem(item.clave);
                let total = valor ? parseInt(valor, 10) : 0;
                reporte += `${item.nombre}: ${total} clics\n`;
            });

            let blob = new Blob([reporte], { type: 'text/plain;charset=utf-8' });
            let url = URL.createObjectURL(blob);
            let a = document.createElement('a');
            a.href = url;
            a.download = `estadisticas-nido-${new Date().toISOString().slice(0,10)}.txt`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }
    </script>
</body>
</html>
